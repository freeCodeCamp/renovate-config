name: Validate Renovate Config

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VALIDATOR: tools/preset-test/node_modules/.bin/renovate-config-validator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/preset-test/package-lock.json

      - name: Install the locked Renovate
        run: npm ci --prefix tools/preset-test

      - name: Validate default config (renovate.json)
        run: $VALIDATOR

      - name: Validate main preset (main.json)
        run: $VALIDATOR main.json

      - name: Validate automerge preset (automerge.json)
        run: $VALIDATOR automerge.json

      - name: Validate default preset (default.json)
        run: $VALIDATOR default.json

      - name: Validate weekend schedule preset
        run: $VALIDATOR schedule-weekend.json

      - name: Test main preset gates, with no automerge
        working-directory: tools/preset-test
        run: node run.mjs --no-automerge ../../main.json

      - name: Test main and automerge preset gates
        working-directory: tools/preset-test
        run: node run.mjs ../../main.json ../../automerge.json
